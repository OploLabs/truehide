name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-and-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run asset integrity checks
        run: npm run test:integrity

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright E2E (Chromium + Firefox)
        # Runs every spec in test/e2e/: crop export verification,
        # PDF redaction security (no extractable text), privacy & no-file-leak,
        # axe-core accessibility, mobile viewports, offline service worker.
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
